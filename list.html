<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <ol>
    <h2>Lista ordenadas</h2> 
        <li>Um</li>
        <li>Dois</li>
        <li>Três</li>
    </ol>

    <ul>
    <h2>Lista Não ordenadas</h2>
        <li>1</li>
        <li>2</li>
        <li>3</li>
    </ul>
</body>
</html>
