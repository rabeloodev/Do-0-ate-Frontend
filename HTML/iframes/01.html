<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
</head>
<body>
    <h2>exemplo sem borda</h2>
    <iframe 
    src="https://www.youtube.com/embed/1y6smkh6c-0" 

    style="height: 200px; width: 300px; border: none;" 

    title="Iframe Example">
    </iframe>

    <h2>Exemplo com borda</h2>
    <iframe 
    src="https://www.youtube.com/embed/1y6smkh6c-0" 

    style="height: 200px; width: 300px; border: 1px solid red;" 

    title="Iframe Example">
    </iframe>

    <h2>Iframe - Destino para um link</h2>
    <iframe src="https://www.w3schools.com" title="Iframe Example" name="iframe_a">
    </iframe>

    <p><a href="https://www.w3schools.com" target="iframe_a">W3Schools</a></p>
</body>
</html>
