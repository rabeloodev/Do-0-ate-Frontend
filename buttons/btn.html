<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botões</title>
</head>
<style>
    .testbtn {background-color: #04aa6d; color: white; font-size: 15px; padding: 12px; border: none; border-radius: 5px; cursor: pointer;}
    .testbtn:hover {background-color: #059862;}
</style>
<body>
    <h1>Buttons</h1>

    <p>Default button with no styling:</p>
    <button>Click me</button>

    <p>Styled button:</p>
    <button class="testbtn">Green Button</button>

    <h2>Button javascript</h2>
    <p>The button use the <code>onclick</code> attribute to run js. When you click the button, it shows an alert message.</p>
    <button class="testbtn"  onclick="alert('Hello')">Click Me</button>

    <h2>Formulario com Button</h2>
    <form action="https://github.com/rabeloodev" target="_blank">
        First name: <input type="text" name="fname">
        <button type="submit">Submit</button>
        <button type="reset">Reset Form</button>
    </form>
</body>
</html>
