<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botões</title>
</head>
<style>
    .testbtn {background-color: #04aa6d; color: white; font-size: 15px; padding: 12px; border: none; border-radius: 5px; cursor: pointer;}

</style>
<body>

    <p>Default button with no styling:</p>
    <button>Click me</button>

    <p>Styled button:</p>
    <button class="testbtn">Green Button</button>
</body>
</html>
