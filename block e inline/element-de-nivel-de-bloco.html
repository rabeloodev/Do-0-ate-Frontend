<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block and Inline</title>
</head>
<body>
    <h2>Elemento div</h2>
    <div style="background-color: black; color: white; padding: 20px;">
        <h2>London</h2>
        <p>London is the capital city of England. It is the most populost city in the United Kingdom, with a metropolitan area of over 13 million inhabitants.</p>
    </div>

    <h2>O span Elemento</h2>
    <p>My mother has <span style="color: blue; font-weight: bold;">blue</span> eyes and my father has <span style="color: darkgreen; font-weight: bold;">dark green</span> eyes.</p> 
</body>
</html>
