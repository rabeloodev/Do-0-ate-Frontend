<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <style>
        table {width: 100%;}

        table, th, td {
            border: 2px solid black;
            background-color: gold;
            border-collapse: collapse;
        }
    </style>
    <table>
        <tr>
            <th>Firstname</th>
            <th>Lastname</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>Roben</td>
            <td>Smith</td>
            <td>34</td>
        </tr>

        <tr>
            <td>Eve</td>
            <td>Jackson</td>
            <td>58</td>
        </tr>
    </table>
</body>
</html>
